[build]
  publish = "."
  command = "python3 scripts/ping_indexnow.py"

# Global headers (FR par défaut)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # CSP en une seule ligne pour éviter les erreurs TOML
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://tpc.googlesyndication.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net; frame-src https://www.youtube.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://pagead2.googlesyndication.com"
    Content-Language = "fr"

# Langue anglaise pour /en/*
[[headers]]
  for = "/en/*"
  [headers.values]
    Content-Language = "en"

# Langue espagnole pour /es/*
[[headers]]
  for = "/es/*"
  [headers.values]
    Content-Language = "es"

# Langue allemande pour /de/*
[[headers]]
  for = "/de/*"
  [headers.values]
    Content-Language = "de"

# Cache raisonnable pour les assets (adapté à un site statique Netlify)
[[headers]]
  for = "/CSS/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/Images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Canonicalise toutes les variantes http(s)/www vers HTTPS apex
[[redirects]]
  from = "http://www.elevenlabs-avis.com/*"
  to = "https://elevenlabs-avis.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.elevenlabs-avis.com/*"
  to = "https://elevenlabs-avis.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://elevenlabs-avis.com/*"
  to = "https://elevenlabs-avis.com/:splat"
  status = 301
  force = true

